<mat-card class="content-margin">
  <mat-card-header class="margin-large-bottom">
    <span class="font-large">
      <button mat-icon-button (click)="returnToList()">
        <mat-icon>arrow_back</mat-icon>
      </button>
      {{ isEditMode ? "Edit employee" : "Add new employee" }}</span
    >
  </mat-card-header>
  <mat-card-content>
    <form [formGroup]="addFormControl" (ngSubmit)="saveForm()">
      <!-- Row 1 -->
      <mat-form-field appearance="outline">
        <mat-label>Name</mat-label>
        <input matInput formControlName="nameField" required />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput formControlName="emailForm" required />
      </mat-form-field>

      <!-- Row 2 -->
      <mat-form-field appearance="outline">
        <mat-label>Skills</mat-label>
        <input matInput formControlName="skillsForm" required />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Salary</mat-label>
        <input matInput formControlName="salaryForm" required />
      </mat-form-field>

      <!-- Row 3 -->
      <mat-form-field appearance="outline">
        <mat-label>Experience</mat-label>
        <input matInput formControlName="expForm" required />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Currently Working</mat-label>
        <input matInput formControlName="workForm" required />
      </mat-form-field>

      <!-- Row 4 -->
      <mat-form-field appearance="outline">
        <mat-label>Location</mat-label>
        <input matInput formControlName="locationForm" required />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Reporting</mat-label>
        <input matInput formControlName="reportForm" required />
      </mat-form-field>

      <!-- Row 5 -->
      <mat-form-field appearance="outline">
        <mat-label>Designation</mat-label>
        <input matInput formControlName="designationForm" required />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Manager Email</mat-label>
        <input matInput formControlName="managerForm" required />
      </mat-form-field>

      <!-- Row 6 -->
      <mat-form-field appearance="outline">
        <mat-label>Department</mat-label>
        <input matInput formControlName="deptForm" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Joined Date</mat-label>
        <input matInput formControlName="joinForm" />
      </mat-form-field>

      <!-- Row 7 -->
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Personal Details</mat-label>
        <input matInput formControlName="personalForm" />
      </mat-form-field>
    </form>

    <div class="button-container" *hasAccess="userRoles.ROLE_ADMIN">
      <!-- <button
        class="btn-cls"
        mat-stroked-button
        [disabled]="!addFormControl.dirty"
        (click)="isEditMode ? updateFormDetails() : saveForm()"
      >
        {{ isEditMode ? "Update" : "Submit" }}
      </button> -->
      <app-button
        [buttonName]="isEditMode ? 'Update' : 'Submit'"
        [disabled]="!addFormControl.valid"
        [isLoading]="isSpin"
        (saveClick)="isEditMode? updateFormDetails():saveForm()"
      >
      </app-button>
    </div>

    <div class="overlay" *ngIf="isSpin">
      <div class="spinner"></div>
    </div>
  </mat-card-content>
</mat-card>
